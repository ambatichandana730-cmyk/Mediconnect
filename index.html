
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediConnect</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f8ff;
      text-align: center;
      padding: 30px;
    }
    h1 { color: #087f8c; }
    .card {
      background: white;
      padding: 20px;
      margin: 15px auto;
      max-width: 400px;
      border-radius: 12px;
    }
    button {
      background: #087f8c;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>🏥 MediConnect</h1>
  <p>Your healthcare, connected.</p>

  <div class="card">
    <h2>Find Hospitals</h2>
    <p>Search for hospitals near your selected location.</p>
  </div>

  <div class="card">
    <h2>Find Doctors</h2>
    <p>Explore doctors and their specialties.</p>
  </div>

  <div class="card">
    <h2>Appointments</h2>
    <p>Plan your doctor consultation.</p>
    <button onclick="alert('Appointment feature coming soon!')">
      Book Appointment
    </button>
  </div>
</body>
</html>
